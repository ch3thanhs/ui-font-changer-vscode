name: VS Code Insiders Compatibility

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Test VS Code Insiders and upstream main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check upcoming VS Code source tokens
        run: npm run check:vscode-source-font-tokens -- main

      - name: Run tests against Insiders
        run: xvfb-run -a npm test -- --code-version insiders

      - name: Check Insiders bundles
        run: npm run check:vscode-bundles
name: CI

on:
  push:
    # Pushes to dev are covered by the dev -> main pull request and by
    # Dependabot pull requests, so only run the push workflow on main.
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-vscode-checks:
    name: Latest VS Code source compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check VS Code engine and API type alignment
        run: npm run check:vscode-engine

      - name: Check latest stable VS Code source tokens
        run: npm run check:vscode-source-font-tokens -- stable

  build:
    name: VS Code ${{ matrix.vscode }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: stable
            package: true
          - os: windows-latest
            vscode: stable
            package: false
          - os: macos-latest
            vscode: stable
            package: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test -- --code-version "${{ matrix.vscode }}"

      - name: Run tests on Windows and macOS
        if: runner.os != 'Linux'
        run: npm test -- --code-version "${{ matrix.vscode }}"

      - name: Check compiled VS Code bundle compatibility
        run: npm run check:vscode-bundles

      - name: Package VSIX
        if: matrix.package
        run: npm run package:vsix -- --out ui-font-changer-for-vscode.vsix

      - name: Upload VSIX artifact
        if: matrix.package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-font-changer-for-vscode-vsix
          path: ui-font-changer-for-vscode.vsix
          if-no-files-found: error
          retention-days: 30

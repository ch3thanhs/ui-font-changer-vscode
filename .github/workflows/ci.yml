name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check VS Code token compatibility
        run: npm run check:vscode-font-tokens

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Run tests
        # vscode-test launches Electron; on Linux it needs a virtual display.
        run: xvfb-run -a npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --allow-missing-repository --out ui-font-changer-for-vscode.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: ui-font-changer-for-vscode-vsix
          path: ui-font-changer-for-vscode.vsix
          if-no-files-found: error
          retention-days: 30

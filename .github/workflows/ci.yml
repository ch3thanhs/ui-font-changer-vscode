name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test bundles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check upcoming VS Code source tokens
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm run check:vscode-font-tokens

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run tests on Windows and macOS
        if: runner.os != 'Linux'
        run: npm test

      - name: Check compiled VS Code bundle compatibility
        run: npm run check:vscode-bundles

      - name: Package VSIX
        if: runner.os == 'Linux'
        run: npx --yes @vscode/vsce package --allow-missing-repository --out ui-font-changer-for-vscode.vsix

      - name: Upload VSIX artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ui-font-changer-for-vscode-vsix
          path: ui-font-changer-for-vscode.vsix
          if-no-files-found: error
          retention-days: 30

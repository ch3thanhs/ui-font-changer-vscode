name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-compatibility:
    name: VS Code 1.85 source compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check pinned VS Code source tokens
        run: npm run check:vscode-source-font-tokens -- 1.85.0

  build:
    name: VS Code ${{ matrix.vscode }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            vscode: 1.85.0
            package: false
          - os: ubuntu-latest
            vscode: 1.110.0
            package: false
          - os: ubuntu-latest
            vscode: stable
            package: true
          - os: windows-latest
            vscode: stable
            package: false
          - os: macos-latest
            vscode: stable
            package: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test -- --code-version "${{ matrix.vscode }}"

      - name: Run tests on Windows and macOS
        if: runner.os != 'Linux'
        run: npm test -- --code-version "${{ matrix.vscode }}"

      - name: Check compiled VS Code bundle compatibility
        run: npm run check:vscode-bundles

      - name: Package VSIX
        if: matrix.package
        run: npm run package:vsix -- --out ui-font-changer-for-vscode.vsix

      - name: Upload VSIX artifact
        if: matrix.package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-font-changer-for-vscode-vsix
          path: ui-font-changer-for-vscode.vsix
          if-no-files-found: error
          retention-days: 30

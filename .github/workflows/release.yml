name: Release

on:
  push:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach and publish; leave empty to run semantic-release"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # Never let two releases (or registry publishes) overlap on the same ref.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Semantic release
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CI runs the full compatibility matrix. Keep a local verification here
      # for commits that do not produce a release.
      - name: Verify project when no release was published
        if: steps.release.outputs.new_release_published != 'true'
        run: |
          npm run lint
          npm run compile
          npm run check:vscode-engine
          npm run check:vscode-source-font-tokens -- stable
          xvfb-run -a npm test
          npm run check:vscode-bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attach-vsix:
    name: Build and attach VSIX to an existing release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check VS Code engine and API type alignment
        run: npm run check:vscode-engine

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: xvfb-run -a npm test

      - name: Check compiled VS Code bundle compatibility
        run: npm run check:vscode-bundles

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches package version
        run: npm run check:release-version -- "${{ env.RELEASE_TAG }}"

      - name: Package VSIX
        run: |
          npm run package:vsix -- \
            --out "ui-font-changer-for-vscode-${{ steps.pkg.outputs.version }}.vsix"

      - name: Upload VSIX to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" \
            "ui-font-changer-for-vscode-${{ steps.pkg.outputs.version }}.vsix" \
            --clobber

  publish-marketplace:
    name: Publish to VS Code Marketplace
    # Only stable releases from main are published. Marketplace rejects semver
    # prerelease versions, so dev releases (1.0.8-dev.N) are never published.
    #
    # Authentication uses Marketplace trusted publishing (GitHub OIDC) only.
    # There is intentionally no PAT fallback.
    needs: semantic-release
    # Stable releases from main. A workflow_dispatch with an explicit tag
    # republishes that existing release's VSIX to both registries.
    if: |
      !cancelled() && (
        (github.ref == 'refs/heads/main' && needs.semantic-release.outputs.new_release_published == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to gate Marketplace publishes.
    # The trusted publishing policy can also be scoped to this environment.
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=ch3thanhs.ui-font-changer-for-vscode
    permissions:
      contents: read
      # Required to request the GitHub OIDC token that vsce exchanges for a
      # short-lived Marketplace credential.
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve release tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="v${{ needs.semantic-release.outputs.new_release_version }}"
          fi
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "VSIX=ui-font-changer-for-vscode-${tag#v}.vsix" >> "$GITHUB_ENV"

      # Download the exact VSIX that semantic-release built and attached to the
      # GitHub release, so Marketplace and GitHub always ship the same artifact.
      - name: Download VSIX from the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$VSIX"
          ls -lh "$VSIX"

      - name: Publish to Visual Studio Marketplace
        # Keep this vsce version in sync with devDependencies in package.json.
        # Running it via npx keeps repository dependencies out of the job that
        # has Marketplace credentials in scope.
        run: |
          echo "Publishing $VSIX with GitHub OIDC trusted publishing."
          npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath "$VSIX"

  publish-openvsx:
    name: Publish to Open VSX
    # Authentication uses Open VSX trusted publishing (GitHub OIDC) only;
    # there is intentionally no OPEN_VSX_TOKEN fallback. Gated like the
    # Marketplace publish, including the explicit-tag backfill.
    needs: semantic-release
    if: |
      !cancelled() && (
        (github.ref == 'refs/heads/main' && needs.semantic-release.outputs.new_release_published == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    # The Open VSX trusted publisher is registered against this environment.
    # Add required reviewers here to gate Open VSX publishes.
    environment:
      name: openvsx
      url: https://open-vsx.org/extension/ch3thanhs/ui-font-changer-for-vscode
    permissions:
      contents: read
      # Required to request the GitHub OIDC token that ovsx exchanges for a
      # short-lived, single-extension Open VSX publishing token.
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve release tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="v${{ needs.semantic-release.outputs.new_release_version }}"
          fi
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "VSIX=ui-font-changer-for-vscode-${tag#v}.vsix" >> "$GITHUB_ENV"

      # Publish the exact VSIX attached to the GitHub release, so GitHub,
      # Marketplace, and Open VSX always ship the same artifact.
      - name: Download VSIX from the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$VSIX"
          ls -lh "$VSIX"

      - name: Publish to Open VSX
        # Running ovsx via npx keeps repository dependencies out of the job that
        # has Open VSX credentials in scope.
        run: |
          echo "Publishing $VSIX with GitHub OIDC trusted publishing."
          npx --yes ovsx@1.3.0 publish --trusted-publishing --skip-duplicate --packagePath "$VSIX"

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    ignore:
      # VS Code ships a specific Node.js major with Electron. @types/node must
      # stay on that major so the extension does not rely on APIs unavailable
      # in the VS Code runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      eslint-toolchain:
        dependency-type: "development"
        patterns:
          - "eslint"
          - "@typescript-eslint/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
